site_name: 玥空玹
site_description: 玥空玹的个人主页 —— 前端工程、界面设计、开源项目
site_url: https://no101011.github.io/
repo_url: https://github.com/No101011/no101011.github.io
repo_name: GitHub
edit_uri: edit/main/docs/
copyright: © 2026 玥空玹 · 用 MkDocs + Material 构建

theme:
  name: material
  language: zh
  font: false                     # 不拉 Google Fonts，用系统字体，国内加载稳
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: false
      toc_depth: 3

nav:
  - 首页: index.md
  - 作品: work.md
  - 关于: about.md
  - 联系: contact.md

extra:
  generator: false               # 不显示 "Made with Material for MkDocs"
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/No101011
      name: GitHub

# 部署：mkdocs gh-deploy --force（推到 gh-pages 分支）
